# ===============================================
# SMART HOSPITAL ENTERPRISE CONFIGURATION
# ===============================================

server.port=8080
server.servlet.context-path=/

# MySQL Database Connection (Production)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_hospital}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=604800000

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:3000,http://localhost:5173,https://ais-dev-jkeboeo7olrbwwhq2o6isd-867710044722.asia-southeast1.run.app}

# Logging
logging.level.com.hospital=INFO
logging.level.org.springframework.security=WARN
